name: Streamlit Cloud Keep-Alive & Health Check

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC) to prevent idle sleep
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Streamlit Cloud Keep-Alive Probe
        run: |
          python scripts/health_check.py --url "https://eyes-on-tigers-7mtepkv8ruq3aaulgr7ves.streamlit.app"

      - name: Direct Fallback Keep-Alive Curl
        if: always()
        run: |
          echo "Executing secondary HTTP keep-alive probe..."
          curl -s -L -I --max-time 15 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36 EoT-KeepAlive/1.0" \
            "https://eyes-on-tigers-7mtepkv8ruq3aaulgr7ves.streamlit.app/?health=check" || true
          echo "Keep-alive probe transmitted successfully."
